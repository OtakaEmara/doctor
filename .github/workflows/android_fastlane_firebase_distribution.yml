name: Android CI/CD with Fastlane and Firebase

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  build:
    name: Build and Deploy Android App
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Set up Java JDK 22
      - name: Set up Java JDK 22
        uses: actions/setup-java@v3
        with:
          java-version: '22'
          distribution: 'temurin'

      # Step 3: Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Step 4: Install Dependencies
      - name: Install Flutter Dependencies
        run: flutter pub get

      # Step 5: Run Flutter Tests
      - name: Run Tests
        run: flutter test
        continue-on-error: true

      # Step 6: Build Release APK
      - name: Build APK
        run: flutter build apk --release

      # Step 7: Set up Ruby for Fastlane
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.1'
          bundler-cache: true
          working-directory: android

      # Step 8: Install Fastlane Gems
      - name: Install Fastlane Dependencies
        run: |
          cd android
          bundle install

      # Step 9: Firebase App Distribution with Fastlane
      - name: Firebase App Distribution
        env:
          FIREBASE_AUTH_TOKEN: ${{ secrets.FIREBASE_AUTH_TOKEN }}
        run: |
          cd android
          fastlane firebase